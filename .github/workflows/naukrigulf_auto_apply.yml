name: Daily NaukriGulf Auto-Apply (Hourly Real-Time Mode)

# ─────────────────────────────────────────────────────────────────────────────
# Runs across 6 windows during Gulf business hours (Mon–Fri) so you are among
# the FIRST applicants whenever a new Gulf job matching your profile is posted.
# Staggered 30 minutes away from Naukri India runs so git commits never collide.
# ─────────────────────────────────────────────────────────────────────────────

on:
  schedule:
    # 9:17 AM IST  (7:47 AM Dubai / 6:47 AM Riyadh) = 3:47 AM UTC
    - cron: '47 3 * * 1-5'
    # 10:47 AM IST (9:17 AM Dubai / 8:17 AM Riyadh) = 5:17 AM UTC
    - cron: '17 5 * * 1-5'
    # 12:17 PM IST (10:47 AM Dubai / 9:47 AM Riyadh) = 6:47 AM UTC
    - cron: '47 6 * * 1-5'
    # 1:47 PM IST  (12:17 PM Dubai / 11:17 AM Riyadh) = 8:17 AM UTC
    - cron: '17 8 * * 1-5'
    # 3:17 PM IST  (1:47 PM Dubai / 12:47 PM Riyadh) = 9:47 AM UTC
    - cron: '47 9 * * 1-5'
    # 4:47 PM IST  (3:17 PM Dubai / 2:17 PM Riyadh) = 11:17 AM UTC
    - cron: '17 11 * * 1-5'
  workflow_dispatch:

jobs:
  auto-apply-gulf:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci || npm install

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run NaukriGulf Auto-Apply Script (batch of 5)
        env:
          NAUKRIGULF_EMAIL: ${{ secrets.NAUKRIGULF_EMAIL }}
          NAUKRIGULF_PASSWORD: ${{ secrets.NAUKRIGULF_PASSWORD }}
          EXP_FILTER_MAX: "4"
          MAX_APPLIES_PER_RUN: "25"
          BATCH_SIZE_PER_RUN: "5"
          NOTICE_PERIOD: "15 days"
          EXPECTED_SALARY_AED: "6000"
        run: xvfb-run --auto-servernum --server-args="-screen 0 1280x1024x24" node naukrigulf-auto-apply.js

      - name: Commit applied-jobs-gulf.json and recruiter-activity-gulf.json
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main || true
          git add applied-jobs-gulf.json recruiter-activity-gulf.json || true
          git diff --staged --quiet || git commit -m "chore(gulf): update applied-jobs-gulf.json [skip ci]"
          git push || true

      - name: Upload Run Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gulf-apply-run-log-${{ github.run_id }}
          path: naukrigulf-apply.log
          if-no-files-found: ignore

      - name: Upload Debug Screenshot on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gulf-apply-error-screenshot-${{ github.run_id }}
          path: naukrigulf-apply-error*.png
          if-no-files-found: ignore

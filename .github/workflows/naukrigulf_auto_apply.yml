name: Daily NaukriGulf Auto-Apply (Hourly Real-Time Mode)

# ─────────────────────────────────────────────────────────────────────────────
# Runs across 5 peak Gulf recruiter active windows during the Gulf workweek:
#   - Monday to Friday (UAE & corporate Gulf workweek) + Sunday (Saudi/Qatar/Kuwait/Oman)
#   - Timed specifically when Gulf recruiters post & shortlist (8:45 AM – 4:15 PM Dubai/GST)
#   - 5 windows × 3 applications per batch = 15 applications/day cap
#   - Staggered away from Naukri India runs so git commits never collide.
# ─────────────────────────────────────────────────────────────────────────────

on:
  schedule:
    # 8:47 AM Dubai (7:47 AM Riyadh / 10:17 AM IST) = 4:47 AM UTC — Morning Gulf office login & first job posts
    - cron: '47 4 * * 0-5'
    # 10:17 AM Dubai (9:17 AM Riyadh / 11:47 AM IST) = 6:17 AM UTC — Peak morning recruiter shortlisting window
    - cron: '17 6 * * 0-5'
    # 11:47 AM Dubai (10:47 AM Riyadh / 1:17 PM IST) = 7:47 AM UTC — Pre-prayer / midday new job postings
    - cron: '47 7 * * 0-5'
    # 2:17 PM Dubai (1:17 PM Riyadh / 3:47 PM IST)   = 10:17 AM UTC — Post-lunch Gulf hiring manager review window
    - cron: '17 10 * * 0-5'
    # 4:17 PM Dubai (3:17 PM Riyadh / 5:47 PM IST)   = 12:17 PM UTC — Late afternoon Gulf wrap-up postings
    - cron: '17 12 * * 0-5'
  workflow_dispatch:

jobs:
  auto-apply-gulf:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci || npm install

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run NaukriGulf Auto-Apply Script (batch of 3, daily cap 15)
        env:
          NAUKRIGULF_EMAIL: ${{ secrets.NAUKRIGULF_EMAIL }}
          NAUKRIGULF_PASSWORD: ${{ secrets.NAUKRIGULF_PASSWORD }}
          EXP_FILTER_MAX: "4"
          MAX_APPLIES_PER_RUN: "15"
          BATCH_SIZE_PER_RUN: "3"
          NOTICE_PERIOD: "15 days"
          EXPECTED_SALARY_AED: "6000"
        run: xvfb-run --auto-servernum --server-args="-screen 0 1280x1024x24" node naukrigulf-auto-apply.js

      - name: Commit applied-jobs-gulf.json and recruiter-activity-gulf.json
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main || true
          git add applied-jobs-gulf.json recruiter-activity-gulf.json || true
          git diff --staged --quiet || git commit -m "chore(gulf): update applied-jobs-gulf.json [skip ci]"
          git push || true

      - name: Upload Run Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gulf-apply-run-log-${{ github.run_id }}
          path: naukrigulf-apply.log
          if-no-files-found: ignore

      - name: Upload Debug Screenshot on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gulf-apply-error-screenshot-${{ github.run_id }}
          path: naukrigulf-apply-error*.png
          if-no-files-found: ignore

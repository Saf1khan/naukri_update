name: Hourly Naukri Profile Refresh

on:
  schedule:
    - cron: '0 * * * *'
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci || npm install

      - name: Run Profile Refresh (API-based, no browser needed)
        env:
          NAUK_AT: ${{ secrets.NAUK_AT }}
          NAUK_RT: ${{ secrets.NAUK_RT }}
          NAUK_SID: ${{ secrets.NAUK_SID }}
          NAUKRI_PROFILE_ID: ${{ secrets.NAUKRI_PROFILE_ID }}
        run: node naukri-api-refresh.js

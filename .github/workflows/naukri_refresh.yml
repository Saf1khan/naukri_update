name: Hourly Naukri Profile Refresh

on:
  schedule:
    - cron: '0 * * * *'
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci || npm install

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run Profile Refresh (Playwright with Cookies)
        env:
          NAUK_AT: ${{ secrets.NAUK_AT }}
          NAUK_RT: ${{ secrets.NAUK_RT }}
          NAUK_SID: ${{ secrets.NAUK_SID }}
        run: node naukri-cookie-refresh.js

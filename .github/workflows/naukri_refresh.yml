name: Hourly Naukri Profile Refresh

on:
  schedule:
    - cron: '0 * * * *'
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci || npm install

      - name: Install Playwright & Chromium Browsers
        run: |
          npx playwright install --with-deps chromium

      - name: Extract Saved Browser Session
        run: |
          if [ -f "naukri-profile.zip" ]; then
            echo "Extracting naukri-profile.zip..."
            unzip_exit_code=0
            unzip -o -q naukri-profile.zip || unzip_exit_code=$?
            if [ "$unzip_exit_code" -gt 1 ]; then
              exit "$unzip_exit_code"
            fi
          fi

      - name: Run Profile Refresh Script
        env:
          NAUKRI_PROFILE_URL: ${{ secrets.NAUKRI_PROFILE_URL || 'https://www.naukri.com/mnjuser/profile' }}
        run: |
          xvfb-run --auto-servernum --server-args="-screen 0 1280x1024x24" node naukri-profile-refresh.js

      - name: Upload Screenshot on Error
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: naukri-error-screenshots
          path: naukri-refresh-error-*.png

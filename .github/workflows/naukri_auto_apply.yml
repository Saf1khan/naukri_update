name: Daily Naukri Auto-Apply

on:
  schedule:
    # Multiple triggers on non-peak minutes to avoid GitHub Actions queue delays
    # 8:47 AM IST = 3:17 AM UTC (Mon-Fri) - Primary early morning run
    - cron: '17 3 * * 1-5'
    # 9:35 AM IST = 4:05 AM UTC (Mon-Fri) - Peak recruiter hours backup
    - cron: '5 4 * * 1-5'
    # 11:15 AM IST = 5:45 AM UTC (Mon-Fri) - Mid-morning backup
    - cron: '45 5 * * 1-5'
    # 1:15 PM IST = 7:45 AM UTC (Mon-Fri) - Afternoon backup
    - cron: '45 7 * * 1-5'
  workflow_dispatch:  # Allow manual trigger from GitHub Actions UI

jobs:
  auto-apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: write  # Needed to commit applied-jobs.json back to repo

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci || npm install

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run Auto-Apply Script
        env:
          NAUK_RT: ${{ secrets.NAUK_RT }}
          NAUK_SID: ${{ secrets.NAUK_SID }}
          JOB_KEYWORDS: "React Developer,Full Stack Developer,Software Engineer,AI Engineer,Frontend Engineer"
          JOB_LOCATIONS: "Bangalore,Hyderabad,Remote"
          JOB_EXPERIENCE_MIN: "1"
          JOB_EXPERIENCE_MAX: "3"
          MAX_APPLIES_PER_RUN: "25"
          NOTICE_PERIOD: "15 days"
          CURRENT_CTC: "3"
          EXPECTED_CTC: "6"
          LOCATION: "Manipal, Udupi"
        run: xvfb-run --auto-servernum --server-args="-screen 0 1280x1024x24" node naukri-auto-apply.js

      - name: Commit applied-jobs.json (persist applied job IDs)
        if: always()  # Always commit even if script had partial success
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add applied-jobs.json || true
          git diff --staged --quiet || git commit -m "chore: update applied-jobs.json [skip ci]"
          git push || true

      - name: Upload Run Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apply-run-log
          path: naukri-apply.log
          if-no-files-found: ignore

      - name: Upload Debug Screenshot on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: apply-error-screenshot
          path: naukri-apply-error*.png
          if-no-files-found: ignore
